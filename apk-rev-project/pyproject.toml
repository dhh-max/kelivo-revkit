[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "apk-reverse-engine"
version = "3.1.0"
description = "全功能 APK 逆向工具集 - 解包/分析/反编译/修补/重打包/签名 一站式工具"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Kelivo RevKit"}]
keywords = ["apk", "reverse-engineering", "android", "dex", "smali", "analysis", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Reverse Engineering",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0.0",
    "pycryptodome>=3.0",
]

[project.optional-dependencies]
full = [
    "androguard>=3.4",
    "pyaxmlparser>=0.3.3",
    "pyelftools>=0.29",
]
decompile = [
    "jadx>=0.0.1",
    "androguard>=3.4",
]

[project.scripts]
reng = "apk_reverse_engine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"