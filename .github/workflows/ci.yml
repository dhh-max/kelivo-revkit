name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify SoLab identity
        shell: pwsh
        run: ./tools/check_project_identity.ps1
      - name: Analyze
        run: flutter analyze
      - name: Core regression tests
        run: >-
          flutter test
          test/features/home/services/tool_registry_consistency_test.dart
          test/features/home/services/tool_schema_snapshot_test.dart
          test/core/services/mcp_server/mcp_tool_schema_snapshot_test.dart
          test/core/services/mcp_server/mcp_http_server_test.dart
          test/core/services/mcp/mcp_tool_service_test.dart
          test/features/home/services/tool_handler_service_test.dart

  android:
    name: Android unit tests and Kotlin compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Verify Android
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin
